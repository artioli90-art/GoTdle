<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️ BannerDle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="top-nav">
    <a href="index.html">👑 GOTdle</a>
    <a href="bannerdle.html">🛡️ BannerDle</a>
</nav>

<h1>🛡️ BannerDle</h1>

<!-- BANNER -->
<div class="banner-image-container">
    <img id="bannerImage" src="" alt="Stemma casata">
</div>

<!-- INPUT -->
<div class="search-container">
    <select id="guessInput"></select>
</div>

<button id="guessButton">Indovina</button>

<!-- HINT BUTTONS -->
<div id="hints">
    <button id="hint-region" disabled>🔒 Regione (3 errori)</button>
    <button id="hint-affiliation" disabled>🔒 Affiliazione (7 errori)</button>
    <button id="hint-letter" disabled>🔒 Prima lettera (10 errori)</button>
</div>

<div id="hint-output"></div>

<!-- RESULTS TABLE -->
<table id="results">
    <thead>
        <tr>
            <th>Casata</th>
            <th>Regione</th>
            <th>Affiliazione</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<div id="victory-card"></div>

<!-- SCRIPTS (ORDINE FONDAMENTALE) -->
<script src="houses.js"></script>
<script src="banner.js"></script>

<!-- POP UP VICTORIAN -->
    <div id="victory-modal" class="hidden">
    <div class="victory-box">
        <h2>🎉 Vittoria!</h2>
        <p>Hai indovinato la casata!</p>
        <img id="victory-image" src="" alt="Casata vincente">
        <button id="close-victory">Chiudi</button>
    </div>
    </div>
    <!-- FINE POP UP VICTORIAN -->
</body>
</html>
