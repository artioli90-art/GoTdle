<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quotedle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .quote-box {
      font-size: 1.3rem;
      margin-bottom: 20px;
      padding: 20px;
      border-left: 4px solid #333;
      background: #f5f5f5;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 15px;
      cursor: pointer;
      margin-right: 10px;
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
    }

    .meta {
      margin-top: 10px;
      color: #555;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <h1>Quotedle</h1>

  <div id="quote" class="quote-box"></div>

  <input id="guess" type="text" placeholder="Chi ha detto questa frase?" />

  <div>
    <button onclick="checkAnswer()">Verifica</button>
    <button onclick="nextQuote()">Prossima</button>
  </div>

  <div id="result" class="result"></div>
  <div id="meta" class="meta"></div>

  <script src="quotes.js"></script>
  <script src="quotedle.js"></script>

</body>
</html>
