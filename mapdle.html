<h1>🗺️ MapDle</h1>

<div class="map-wrapper">
    <img id="mapImage" src="" alt="map">
    <div id="debugOverlay"></div>
    <div id="marker"></div>
</div>

<div class="controls">
    <select id="guessInput"></select>
    <button id="checkBtn">Verifica</button>
</div>
    <!-- DEBUG CONTROLS -->
<div class="debug-controls">
    <button id="prevMapBtn">⬅ Prev</button>
    <button id="nextMapBtn">Next ➡</button>
</div>
<!-- DEBUG CONTROLS fine -->
<div id="feedback"></div>

<table id="results">
    <thead>
        <tr>
            <th>Tentativo</th>
            <th>Risultato</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="map.js"></script>
<script src="mapdle.js"></script>
